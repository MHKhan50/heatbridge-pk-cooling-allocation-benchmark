[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heatbridge-pk"
version = "0.2.0"
description = "Synthetic benchmark for equitable outage-resilient cooling-centre allocation"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]

[project.optional-dependencies]
plot = ["matplotlib>=3.5,<3.10"]

[tool.setuptools]
packages = ["heatbridge_pk"]
